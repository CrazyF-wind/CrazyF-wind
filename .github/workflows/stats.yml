name: Update profile stats

on:
  schedule:
    # Every Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test

      - name: Generate top languages card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/top-languages.mjs

      - name: Generate contributions card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contributions.mjs

      - name: Generate profile card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/profile-card.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "Stats unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg assets/contributions.svg assets/profile-card.svg
          git commit -m "chore: update profile stats"
          git push
