<svg xmlns="http://www.w3.org/2000/svg" width="495" height="256" viewBox="0 0 495 256" role="img" aria-label="Contributions by organization across CrazyF-wind, tavorit-dev, Open-Multiverse, open-wuxu">
  <style>
    .title { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
